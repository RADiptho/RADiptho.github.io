name: Remove failed Publications visual overrides
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unsuccessful runtime and banner overrides
        shell: bash
        run: |
          rm -f runtime-fixes.js
          sed -i '/runtime-fixes\.js/d' index.html
          if [ -f banner-fix.css ]; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path("banner-fix.css")
          s=p.read_text()
          marker="/* Publication page: show the full first-page artwork instead of cropping it. */"
          if marker in s:
              s=s.split(marker)[0].rstrip()+"\n"
          p.write_text(s)
          PY
          fi
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove ineffective Publications runtime overrides"
            git push
          fi
