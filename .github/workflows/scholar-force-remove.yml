name: Force remove Scholar metrics card
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          cat > scholar-force-remove.js <<'JS'
          (() => {
            function kill(){
              const els=[...document.querySelectorAll('body *')];
              const matches=els.filter(e=>{
                const t=(e.innerText||'').replace(/\s+/g,' ');
                return t.includes('Google Scholar') &&
                       t.includes('Scholar publications') &&
                       t.includes('Citations') &&
                       t.includes('h-index') &&
                       t.includes('i10-index') &&
                       (t.includes('Open profile') || t.includes('HTTP 403'));
              });
              if(!matches.length) return;
              // Smallest element containing the complete Scholar UI is the card.
              matches.sort((a,b)=>a.getBoundingClientRect().height-b.getBoundingClientRect().height);
              const card=matches.find(e=>{
                const r=e.getBoundingClientRect();
                return r.width>600 && r.height>120 && r.height<500;
              }) || matches[0];
              if(card && card!==document.body && card.tagName!=='HTML') card.remove();
            }
            function start(){
              kill();
              const observer=new MutationObserver(kill);
              observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
              [50,150,300,600,1000,2000,4000].forEach(ms=>setTimeout(kill,ms));
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
          })();
          JS
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove all prior Scholar-removal script references to avoid conflicts.
          s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*(?:clean-scholar|remove-scholar-robust|scholar-force-remove)[^"\']*["\'][^>]*></script>','',s,flags=re.I)
          s=s.replace('</body>','<script src="scholar-force-remove.js?v=20261028-2"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scholar-force-remove.js
          git commit -m "Force remove complete Google Scholar metrics card"
          git push
