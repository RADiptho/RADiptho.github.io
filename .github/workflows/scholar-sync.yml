name: Sync Google Scholar
# Six times a day this reads the Google Scholar profile, Crossref and DataCite into data/scholar.json and
# commits the file when there is something to record. The site reads that file when a page is opened.
#
# Google Scholar refuses almost every request from GitHub's servers (HTTP 403 / CAPTCHA). Two ways around
# an empty-handed run, both optional repository secrets (Settings -> Secrets and variables -> Actions):
#   SERPAPI_KEY    a free key from serpapi.com: the profile is then read through SerpApi, which is not
#                  refused. With it the figures on the site are never more than about eight hours old.
#   SCHOLAR_PROXY  an HTTP(S) proxy URL for the direct request.
# With neither, the script still asks Google Scholar directly, keeps the last good figures with their date
# when it is refused, and records the refusal. Crossref and DataCite are open and need nothing.
# "Run workflow" on the Actions tab reads everything at once, whatever was read before.
# The job fails only for something that needs attention: a rejected key, changed page markup, an I/O error.
on:
  workflow_dispatch:
  schedule:
    # Six separate runs: with a key, Scholar is read on every second one (three searches a day);
    # without a key, each run is another chance that a runner is let through.
    - cron: '17 1 * * *'
    - cron: '43 5 * * *'
    - cron: '11 9 * * *'
    - cron: '37 13 * * *'
    - cron: '7 17 * * *'
    - cron: '31 21 * * *'
permissions:
  contents: write
concurrency:
  group: scholar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Read Google Scholar, Crossref and DataCite
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_PROXY: ${{ secrets.SCHOLAR_PROXY }}
          READ_NOW: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python scripts/sync_scholar.py --user SSoTLJoAAAAJ --out data/scholar.json --attempts 3 --message-file "$RUNNER_TEMP/scholar-message.txt" $READ_NOW
      - name: Commit the data file if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          if git diff --cached --quiet; then
            echo "data/scholar.json unchanged"
          else
            message="Scholar sync"
            if [ -s "$RUNNER_TEMP/scholar-message.txt" ]; then message=$(head -n 1 "$RUNNER_TEMP/scholar-message.txt"); fi
            git commit -m "$message"
            git pull --rebase origin main
            git push
          fi
