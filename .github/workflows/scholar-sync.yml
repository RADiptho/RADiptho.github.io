name: Sync Google Scholar
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
concurrency:
  group: scholar-daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch Google Scholar data
        run: python scripts/sync_scholar.py --user SSoTLJoAAAAJ --out data/scholar.json --strict
      - name: Commit refreshed data if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Google Scholar metrics and sync status"
            git push
          fi
