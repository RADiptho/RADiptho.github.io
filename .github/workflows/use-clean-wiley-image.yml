name: Switch Publications to clean Wiley image
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("publications-definitive.js")
          s=p.read_text()
          s=s.replace("Wiley_article_first_page_2x.png","Wiley-Style Mango Disease Research Article.png")
          # ensure native full-image rendering remains uncropped
          s=s.replace("img.src=IMAGE;","img.src=encodeURI(IMAGE);")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications-definitive.js
          git commit -m "Use clean Wiley image on Publications hero" || exit 0
          git push
