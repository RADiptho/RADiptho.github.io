name: Show Scholar sync failure accurately
on:
  push:
    paths:
      - '.github/workflows/scholar-status-display.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add status renderer to website
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- SCHOLAR_SYNC_STATUS_FIX_2026 -->'
          js=r"""
          <script>
          (async function(){
            try {
              const response = await fetch('data/scholar.json?ts=' + Date.now(), {cache:'no-store'});
              if (!response.ok) return;
              const data = await response.json();
              if (data.metrics || !data.last_attempt || !data.error) return;
              const candidates = [...document.querySelectorAll('p,div,span')];
              const el = candidates.find(e => e.children.length < 3 && e.textContent.includes('Google Scholar metrics have not been synchronized yet'));
              if (!el) return;
              const when = new Date(data.last_attempt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
              const text = document.createTextNode('Google Scholar metrics are temporarily unavailable because Google Scholar blocked the automated request (HTTP 403). Last attempted: ' + when + '. ');
              el.replaceChildren(text);
              const a=document.createElement('a');
              a.href=data.profile?.url || 'https://scholar.google.com/citations?user=SSoTLJoAAAAJ';
              a.target='_blank';
              a.rel='noopener noreferrer';
              a.textContent='View Google Scholar profile.';
              el.appendChild(a);
            } catch(e) { console.warn('Scholar status unavailable',e); }
          })();
          </script>
          """
          if marker not in s:
            s=s.replace('</body>',marker+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit status display
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Display Scholar sync block and last attempt accurately"
            git push
          fi
