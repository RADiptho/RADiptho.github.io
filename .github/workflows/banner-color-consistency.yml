name: Fix publication banner and consistent heading colors
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add safe banner override stylesheet
        shell: bash
        run: |
          cat > banner-fix.css <<'CSS'
          /* Consistent page-banner typography; existing page images remain unchanged. */
          .banner:not(.home) .banner-title h1,
          .banner:not(.home) .banner-title h2,
          .banner:not(.home) .banner-title .title {
            color: #fff !important;
            font-size: clamp(34px, 5vw, 62px) !important;
            line-height: 1.1 !important;
            font-weight: 600 !important;
            text-shadow: 0 2px 12px rgba(0,0,0,.72) !important;
          }
          .banner:not(.home) .banner-title .bar {
            background: #0e8c57 !important;
            height: 7px !important;
          }
          .banner.p-publications {
            min-height: clamp(420px, 55vh, 550px) !important;
            background-size: cover !important;
            background-position-x: center !important;
          }
          .banner.p-publications .banner-title {
            padding-bottom: 28px !important;
          }
          @media (max-width: 760px) {
            .banner.p-publications { min-height: 320px !important; }
            .banner:not(.home) .banner-title h1,
            .banner:not(.home) .banner-title h2,
            .banner:not(.home) .banner-title .title {
              font-size: clamp(28px, 7vw, 44px) !important;
            }
          }
          CSS
          if ! grep -q 'banner-fix.css' index.html; then
            sed -i 's#</head>#<link rel="stylesheet" href="banner-fix.css?v=20261028">\n</head>#' index.html
          fi
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html banner-fix.css
          if ! git diff --cached --quiet; then
            git commit -m "Fix page banner sizing and consistent heading colors"
            git push
          fi
