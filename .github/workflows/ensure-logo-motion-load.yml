name: Ensure live logo motion script loads
on:
  push:
    paths:
      - '.github/workflows/ensure-logo-motion-load.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert '</body>' in s
          import re
          s=re.sub(r'<script\s+src=["\']site-reveal-2027\.js[^"\']*["\']\s+defer\s*></script>','',s)
          s=s.replace('</body>','<script src="site-reveal-2027.js?v=20271028motion9"></script>\n</body>',1)
          p.write_text(s)
          print('Motion script installed:',s.count('site-reveal-2027.js'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Load updated logo motion script with cache-busting URL' && git push)
