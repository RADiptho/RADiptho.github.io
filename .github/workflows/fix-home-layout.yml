name: Fix Home profile layout
on:
  push:
    paths:
      - '.github/workflows/fix-home-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct overlapping social buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '.home-grid { display: grid; grid-template-columns: clamp(180px, 24vh, 300px) minmax(0, 1fr); gap: clamp(22px, 3vw, 40px); align-items: start; }'
          new = '.home-grid { display: grid; grid-template-columns: clamp(200px, 24vw, 300px) minmax(0, 1fr); gap: clamp(22px, 3vw, 40px); align-items: start; }'
          if old in s:
              s = s.replace(old, new, 1)
          old_links = '.links { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }'
          new_links = '.links { display: grid; grid-template-columns: minmax(0, 1fr); gap: 7px; margin-top: 12px; width: 100%; min-width: 0; }'
          if old_links in s:
              s = s.replace(old_links, new_links, 1)
          s = s.replace('.links a { --brand:', '.links a { min-width: 0; max-width: 100%; box-sizing: border-box; --brand:', 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix Home social links overlapping About Me"
            git push
          fi
