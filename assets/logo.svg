  <path d="M64 9 L111 36.5 V91.5 L64 119 L17 91.5 V36.5 Z" fill="url(#bg)" stroke="url(#bg)" stroke-width="10" stroke-linejoin="round"/>
  <path d="M64 9 L111 36.5 V91.5 L64 119 L17 91.5 V36.5 Z" fill="url(#sheen)" stroke="none"/>
  <path d="M64 9 L111 36.5 V91.5 L64 119 L17 91.5 V36.5 Z" fill="none" stroke="url(#rimA)" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M64 17 L104 40.5 V87.5 L64 111 L24 87.5 V40.5 Z" fill="none" stroke="#7FE6B0" stroke-opacity="0.28" stroke-width="1.4"/>
  <!-- network spokes -->
