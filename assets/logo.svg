    <linearGradient id="em" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FF0AE"/><stop offset="1" stop-color="#0E8C57"/></linearGradient>
    <linearGradient id="rimA" x1="0" y1="0" x2="1" y2="1"><stop offset="0.35" stop-color="#7FE6B0" stop-opacity="0"/><stop offset="1" stop-color="#7FE6B0" stop-opacity="0.9"/></linearGradient>
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.85"><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
